<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palmwine &amp; Pepper | Modern Nigerian Grill, Lagos</title>
    <meta name="description" content="A fictional Lagos restaurant website: menu, gallery and table booking. Portfolio demo by Joshua Adesomoju." />
    <meta name="theme-color" content="#e4e4df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151c18" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <script>
      // Scroll reveals: hide-until-seen only applies once JS is confirmed running.
      (function (d) {
        if (!("IntersectionObserver" in window)) return;
        d.classList.add("rv");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("rv-calm");
        setTimeout(function () { if (!window.__rvReady) d.classList.remove("rv", "rv-calm"); }, 3000);
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
